name: Refresh API tools

# Keeps the MCP tool catalogue in lock-step with the live Panelica External API
# and — when it changed — ships it: patch version bump, git tag, npm publish,
# Docker image and MCP Registry entry, all in this one workflow.
#
# Why one workflow: a commit pushed with GITHUB_TOKEN never triggers other
# workflows, so a separate "publish on push" job would never fire for the bot's
# refresh commit. Chaining the publish job here closes that gap.
#
# Secrets (repository → Settings → Secrets and variables → Actions):
#   PANELICA_SPEC_URL  reachable spec, e.g. https://panel.example.com:8443/api/external/v1/api-spec
#                      (a SECRET, not a variable: the panel host must not appear in public logs)
#   NPM_TOKEN          npm granular token with publish rights on `panelica-mcp` (2FA bypass)
#
# The /v1/api-spec endpoint is unauthenticated metadata; no API key is used here.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish even if the catalogue did not change (re-release current main)"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * 1" # every Monday 06:17 UTC

permissions:
  contents: write
  packages: write
  id-token: write # MCP Registry OIDC login

concurrency:
  group: refresh-tools
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      version: ${{ steps.commit.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Regenerate tool catalogue from the live spec
        env:
          PANELICA_SPEC_URL: ${{ secrets.PANELICA_SPEC_URL }}
          # Only public spec METADATA is fetched; the reference panel may serve its
          # own certificate. Accepting it here is limited to this metadata fetch.
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: |
          BEFORE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('tools/tools.json','utf8')).length)")
          echo "before=$BEFORE" >> "$GITHUB_ENV"
          if [ -z "$PANELICA_SPEC_URL" ]; then
            echo "PANELICA_SPEC_URL secret is not set — building from the committed snapshot."
          fi
          node tools/build-tools.mjs

      - name: Leak guard on the public snapshot
        run: |
          # The snapshot is committed to a PUBLIC repository. Fail loudly if any
          # address-, identifier- or secret-shaped string slipped past redaction.
          if grep -nE '([0-9]{1,3}\.){3}[0-9]{1,3}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|/opt/panelica|/home/[a-z]|@[a-z0-9-]+\.[a-z]{2,}|\b(pk|sk)_[A-Za-z0-9]{8,}' tools/api-spec.json tools/tools.json; then
            echo "::error::leak guard matched — refusing to commit"
            exit 1
          fi
          echo "Snapshot clean."

      - name: Commit, bump and tag if the catalogue changed
        id: commit
        run: |
          git config user.name  "Panelica"
          git config user.email "info@panelica.com"
          CURRENT=$(node -p "require('./package.json').version")
          if git diff --quiet -- tools/tools.json tools/api-spec.json; then
            echo "No API changes — tool catalogue already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('tools/tools.json','utf8')).length)")
          # Shrink guard: the catalogue must never silently lose tools. A smaller
          # count means the reference panel runs an OLDER release than the one the
          # committed catalogue was generated from — skip and keep the richer one.
          if [ "$COUNT" -lt "$before" ]; then
            echo "Refusing to shrink catalogue: $before -> $COUNT tools (reference panel is behind). Skipping."
            git checkout -- tools/tools.json tools/api-spec.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Patch bump in package.json + server.json (single version everywhere;
          # src reads package.json at runtime).
          NEW=$(npm version patch --no-git-tag-version)
          NEW=${NEW#v}
          node -e "const fs=require('fs');const p='server.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='$NEW';j.packages[0].version='$NEW';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          # README badge + counts follow the catalogue.
          sed -i -E "s/tools-[0-9]+-blue/tools-${COUNT}-blue/; s/\*\*[0-9]+ tools\*\*/**${COUNT} tools**/; s/\"[0-9]+ tools available\"/\"${COUNT} tools available\"/" README.md
          git add tools/tools.json tools/api-spec.json package.json package-lock.json server.json README.md
          git commit -m "chore: refresh tool catalogue from live API (${COUNT} tools) — v${NEW}"
          git tag "v${NEW}"
          git push origin HEAD:main "v${NEW}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true' || inputs.publish == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # the refresh job pushed the bump commit here

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Build
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::error::NPM_TOKEN secret missing"; exit 1; fi
          npm publish --access public --ignore-scripts

      - name: Tag the published version (manual re-release of an untagged main)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "tag v${VERSION} already exists"
          else
            git config user.name  "Panelica"
            git config user.email "info@panelica.com"
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/panelica/panelica-mcp
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.refresh.outputs.version }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publish to MCP Registry
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher validate
          # The registry verifies the version against npm; give the registry a
          # minute to see the fresh publish before giving up.
          for i in 1 2 3 4 5 6; do ./mcp-publisher publish && exit 0; echo "registry not ready yet (attempt $i), retrying…"; sleep 20; done
          exit 1
